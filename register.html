<!DOCTYPE html>
<html lang="en">

<head>
    <!-- same head as before -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - System</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* same password toggle styles */
        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 2.5rem;
        }

        .toggle-password {
            position: absolute;
            right: 0.8rem;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            background: none;
            border: none;
            line-height: 0;
            padding: 0;
            color: var(--text-muted);
            transition: color 0.2s;
        }

        .toggle-password:hover {
            color: var(--primary);
        }

        .toggle-password svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
        }
    </style>
</head>

<body class="login-body">
    <div class="login-wrapper">
        <div class="login-header">
            <span class="logo-icon">🔵🔴🟡</span>
            <h2>Create Your Account</h2>
        </div>
        <form class="login-form" id="registerForm" autocomplete="on">
            <input type="text" id="fullName" name="fullName" placeholder="Full Name (e.g., Juan Dela Cruz)" required
                autocomplete="off">
            <input type="email" id="email" name="email" placeholder="DepEd Email" required autocomplete="off">
            <div class="password-wrapper">
                <input type="password" id="password" name="password" placeholder="Password (min. 6 characters)" required
                    autocomplete="new-password">
                <button type="button" class="toggle-password" data-target="password" aria-label="Show password">
                    <svg viewBox="0 0 24 24">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                        <circle cx="12" cy="12" r="3" />
                    </svg>
                </button>
            </div>
            <div class="password-wrapper">
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm Password"
                    required autocomplete="new-password">
                <button type="button" class="toggle-password" data-target="confirmPassword" aria-label="Show password">
                    <svg viewBox="0 0 24 24">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                        <circle cx="12" cy="12" r="3" />
                    </svg>
                </button>
            </div>
            <select id="roleSelect" name="role" required autocomplete="off">
                <option value="" disabled selected>Select Your Role</option>
                <option value="teacher">Teacher</option>
                <option value="principal">Principal</option>
            </select>
            <button type="submit" class="login-submit-btn">Create Account</button>
            <p style="text-align: center; margin-top: 1rem; font-size: 0.95rem;">
                Already have an account? <a href="login.html" style="color: var(--primary); font-weight: 600;">Log
                    In</a>
            </p>
        </form>
    </div>

    <script>
        // Password toggle (unchanged)
        const eyeOpen = `<svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
        const eyeClosed = `<svg viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;
        document.querySelectorAll('.toggle-password').forEach(btn => {
            btn.addEventListener('click', function () {
                const targetId = this.getAttribute('data-target');
                const input = document.getElementById(targetId);
                const isPassword = input.type === 'password';
                input.type = isPassword ? 'text' : 'password';
                this.innerHTML = isPassword ? eyeClosed : eyeOpen;
            });
        });
    </script>

    <script type="module">
        // 🔁 New Supabase import
        import { supabase } from "./Meraki_Supabase.js";

        document.getElementById('registerForm').addEventListener('submit', async function (event) {
            event.preventDefault();

            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const role = document.getElementById('roleSelect').value;

            const submitBtn = document.querySelector('.login-submit-btn');
            submitBtn.textContent = "Creating Account...";

            // Basic validation
            if (password !== confirmPassword) {
                alert("Passwords do not match.");
                submitBtn.textContent = "Create Account";
                return;
            }
            if (password.length < 6) {
                alert("Password should be at least 6 characters.");
                submitBtn.textContent = "Create Account";
                return;
            }
            if (!fullName || !email) {
                alert("Please fill in all fields.");
                submitBtn.textContent = "Create Account";
                return;
            }

            try {
                // Sign up with Supabase – user metadata automatically populates the trigger
                const { data, error } = await supabase.auth.signUp({
                    email,
                    password,
                    options: {
                        data: {
                            name: fullName,
                            role: role
                        }
                    }
                });

                if (error) throw error;

                // The database trigger will create the profiles row automatically.
                // No manual insert needed.

                // Redirect based on role
                if (role === 'teacher') {
                    window.location.href = 'dashboard.html';
                } else if (role === 'principal') {
                    window.location.href = 'principal.html';
                }
            } catch (error) {
                console.error("Registration error:", error);
                alert("Registration failed: " + error.message);
                submitBtn.textContent = "Create Account";
            }
        });
    </script>
</body>

</html>
